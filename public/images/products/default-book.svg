<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="defaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="560" rx="16" fill="url(#defaultBg)"/>

  <!-- Spine -->
  <rect x="0" y="0" width="22" height="560" fill="#020617" opacity="0.7"/>
  <line x1="22" y1="0" x2="22" y2="560" stroke="#b91c1c" stroke-width="2"/>

  <!-- Logo emblem -->
  <g transform="translate(160, 180)">
    <rect width="80" height="80" rx="20" fill="#b91c1c" opacity="0.9"/>
    <text x="40" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="900" text-anchor="middle">L</text>
  </g>

  <!-- Text -->
  <text x="200" y="310" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="2">LITERA STORE</text>
  <text x="200" y="335" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">KOLEKSI BUKU &amp; ATK</text>

  <!-- Decorative line -->
  <line x1="120" y1="360" x2="280" y2="360" stroke="#475569" stroke-width="1"/>

  <text x="200" y="500" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">GRAMEDIA STYLE STORE</text>
</svg>
