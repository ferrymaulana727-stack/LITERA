<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="penBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="zebraRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#penBg)"/>

  <!-- Geometric Accent Line -->
  <line x1="30" y1="90" x2="370" y2="90" stroke="#ef4444" stroke-width="2"/>

  <!-- Japanese Stationery Brand Tag -->
  <text x="40" y="55" fill="#f87171" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" letter-spacing="3">ZEBRA JAPAN</text>
  <text x="360" y="55" fill="#a1a1aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="end">GEL INK PEN</text>

  <!-- Title -->
  <text x="200" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="1">SARASA CLIP</text>
  <text x="200" y="175" fill="#fca5a5" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="3">0.5 MM BLACK</text>

  <!-- Pen Visual Graphic -->
  <g transform="translate(180, 205)">
    <!-- Pen Barrel -->
    <rect x="10" y="0" width="20" height="190" rx="3" fill="#3f3f46" stroke="#71717a" stroke-width="1"/>
    <!-- Clear Grip Section -->
    <rect x="12" y="120" width="16" height="50" rx="2" fill="#ef4444" opacity="0.85"/>
    <line x1="12" y1="130" x2="28" y2="130" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <line x1="12" y1="140" x2="28" y2="140" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <line x1="12" y1="150" x2="28" y2="150" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <line x1="12" y1="160" x2="28" y2="160" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
    <!-- Pen Nib Cone -->
    <polygon points="12,190 28,190 22,215 18,215" fill="#d4d4d8"/>
    <!-- Ballpoint tip -->
    <circle cx="20" cy="217" r="1.5" fill="#09090b"/>
    <!-- Binder Clip on Top -->
    <rect x="2" y="15" width="8" height="60" rx="2" fill="#ef4444"/>
    <text x="-12" y="50" fill="#ffffff" font-family="monospace" font-size="7" font-weight="900" transform="rotate(-90,-12,50)">SARASA</text>
    <!-- Push button top -->
    <rect x="13" y="-12" width="14" height="12" rx="2" fill="#71717a"/>
  </g>

  <!-- Feature Bullet Tags -->
  <g transform="translate(70, 440)">
    <rect width="125" height="24" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="62" y="16" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">&#8226; Water-Based Ink</text>
  </g>
  <g transform="translate(205, 440)">
    <rect width="125" height="24" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="62" y="16" fill="#f43f5e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">&#8226; Rapid Dry Formula</text>
  </g>

  <!-- Footer SKU -->
  <text x="200" y="515" fill="#71717a" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">SKU: ATK-PEN-01 | GRAMEDIA STATIONERY</text>
</svg>
