<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="notebookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#notebookBg)"/>
  <rect width="400" height="560" rx="16" fill="url(#gridPattern)"/>

  <!-- Left Binder Holes (Loose leaf punch holes) -->
  <g transform="translate(18, 0)" fill="#ffffff" opacity="0.9">
    <circle cx="8" cy="70" r="5"/>
    <circle cx="8" cy="110" r="5"/>
    <circle cx="8" cy="150" r="5"/>
    <circle cx="8" cy="190" r="5"/>
    <circle cx="8" cy="230" r="5"/>
    <circle cx="8" cy="270" r="5"/>
    <circle cx="8" cy="310" r="5"/>
    <circle cx="8" cy="350" r="5"/>
    <circle cx="8" cy="390" r="5"/>
    <circle cx="8" cy="430" r="5"/>
    <circle cx="8" cy="470" r="5"/>
  </g>

  <!-- White Label Area in Center -->
  <rect x="55" y="100" width="310" height="340" rx="12" fill="#ffffff" stroke="#e0f2fe" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>

  <!-- Brand Campus Header -->
  <rect x="55" y="100" width="310" height="65" rx="12" fill="#0284c7"/>
  <rect x="55" y="150" width="310" height="15" fill="#0284c7"/>
  <text x="210" y="142" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" text-anchor="middle" letter-spacing="4">Campus</text>

  <!-- Product Name -->
  <text x="210" y="205" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle">
    LOOSE LEAF B5
  </text>
  <text x="210" y="228" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    Rule 6mm &bull; 36 Lines &bull; 26 Holes
  </text>

  <!-- Sheet Count Badge -->
  <g transform="translate(160, 260)">
    <circle cx="50" cy="30" r="32" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="50" y="28" fill="#0284c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="middle">100</text>
    <text x="50" y="44" fill="#0369a1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">LEMBAR</text>
  </g>

  <!-- Paper Quality Features -->
  <g transform="translate(90, 360)">
    <text x="0" y="0" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">&bull; 75 GSM High Quality Paper</text>
    <text x="0" y="22" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">&bull; Tidak Tembus Tinta Gel / Pulpen</text>
    <text x="0" y="44" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">&bull; Cocok untuk Binder B5 Standar</text>
  </g>

  <!-- Footer SKU -->
  <text x="210" y="505" fill="#bae6fd" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">SKU: ATK-KRT-01 | GRAMEDIA STATIONERY</text>
</svg>
