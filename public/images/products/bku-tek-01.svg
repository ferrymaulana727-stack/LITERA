<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="laravelRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d20"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#techBg)"/>

  <!-- Code Grid Background lines -->
  <line x1="40" y1="100" x2="380" y2="100" stroke="#374151" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="40" y1="200" x2="380" y2="200" stroke="#374151" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.3"/>
  <line x1="40" y1="300" x2="380" y2="300" stroke="#374151" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.3"/>

  <!-- Spine effect -->
  <rect x="0" y="0" width="22" height="560" fill="#030712" opacity="0.7"/>
  <line x1="22" y1="0" x2="22" y2="560" stroke="#ef4444" stroke-width="2"/>

  <!-- Version Ribbon -->
  <g transform="translate(300, 30)">
    <rect width="75" height="26" rx="6" fill="url(#laravelRed)"/>
    <text x="37" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', monospace" font-size="11" font-weight="900" text-anchor="middle">v11.x</text>
  </g>

  <!-- Category Label -->
  <text x="45" y="55" fill="#f87171" font-family="'Plus Jakarta Sans', monospace" font-size="11" font-weight="800" letter-spacing="2">BUKU KOMPUTER</text>

  <!-- Laravel Logo Icon Abstract -->
  <g transform="translate(45, 110)">
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" fill="none" stroke="url(#laravelRed)" stroke-width="3"/>
    <polygon points="40,20 60,32 60,58 40,70 20,58 20,32" fill="url(#laravelRed)" opacity="0.3"/>
    <text x="40" y="52" fill="#ffffff" font-family="monospace" font-size="20" font-weight="900" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Titles -->
  <text x="45" y="240" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="900" letter-spacing="-0.5">MASTERING</text>
  <text x="45" y="280" fill="url(#laravelRed)" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="900">LARAVEL 11</text>
  <text x="45" y="315" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700">&amp; ELOQUENT ORM</text>

  <!-- Feature Pills -->
  <g transform="translate(45, 360)">
    <rect width="140" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="70" y="17" fill="#cbd5e1" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">MVC Architecture</text>
  </g>
  <g transform="translate(195, 360)">
    <rect width="145" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="72" y="17" fill="#cbd5e1" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">DB Transactions</text>
  </g>

  <!-- Subtitle Summary -->
  <text x="45" y="430" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">
    Panduan lengkap membangun sistem inventori &amp;
  </text>
  <text x="45" y="450" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">
    aplikasi enterprise berbasis Laravel &amp; MySQL.
  </text>

  <!-- Footer SKU -->
  <text x="210" y="520" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">SKU: BKU-TEK-01 | GRAMEDIA IT PRESS</text>
</svg>
