<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="habitBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbf0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>
    <radialGradient id="atomicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#habitBg)"/>

  <!-- Spine effect -->
  <rect x="0" y="0" width="22" height="560" fill="#e5dec9" opacity="0.8"/>
  <line x1="22" y1="0" x2="22" y2="560" stroke="#d5cca8" stroke-width="1.5"/>

  <!-- Bestseller Ribbon -->
  <g transform="translate(110, 40)">
    <rect width="200" height="26" rx="13" fill="#dc2626"/>
    <text x="100" y="17" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">#1 INTERNATIONAL BESTSELLER</text>
  </g>

  <!-- Author Name -->
  <text x="210" y="125" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="3">JAMES CLEAR</text>

  <!-- Book Title -->
  <text x="210" y="195" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="0">ATOMIC</text>
  <text x="210" y="240" fill="#d97706" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="0">HABITS</text>

  <!-- Atomic Orbit Illustration -->
  <g transform="translate(210, 335)">
    <circle cx="0" cy="0" r="70" fill="url(#atomicGlow)"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#d97706" stroke-width="1.5" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#2563eb" stroke-width="1.5" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#059669" stroke-width="1.5" transform="rotate(90)"/>
    <!-- Nucleus -->
    <circle cx="0" cy="0" r="10" fill="#dc2626"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Indonesian Subtitle -->
  <text x="210" y="445" fill="#1e293b" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    Perubahan Kecil yang Memberikan
  </text>
  <text x="210" y="468" fill="#d97706" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    Hasil Luar Biasa
  </text>

  <!-- Footer SKU -->
  <text x="210" y="525" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">SKU: BKU-SLF-01 | GPU GRAMEDIA</text>
</svg>
