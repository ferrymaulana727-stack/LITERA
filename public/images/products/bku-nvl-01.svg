<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192f"/>
      <stop offset="50%" stop-color="#0f3460"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" rx="16" fill="url(#oceanBg)"/>
  
  <!-- Subtle Wave Pattern -->
  <path d="M 0,280 Q 100,240 200,280 T 400,280 L 400,560 L 0,560 Z" fill="url(#waveGrad)"/>
  <path d="M 0,330 Q 120,290 220,330 T 400,330 L 400,560 L 0,560 Z" fill="url(#waveGrad)"/>
  <path d="M 0,390 Q 90,360 200,390 T 400,390 L 400,560 L 0,560 Z" fill="url(#waveGrad)"/>

  <!-- Border spine effect -->
  <rect x="0" y="0" width="22" height="560" fill="#030b14" opacity="0.6"/>
  <line x1="22" y1="0" x2="22" y2="560" stroke="#1f4068" stroke-width="1.5"/>

  <!-- GPU Badge Top Left -->
  <g transform="translate(45, 35)">
    <rect width="64" height="24" rx="6" fill="#e94560" opacity="0.9"/>
    <text x="32" y="16" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">GPU</text>
  </g>

  <!-- Genre Tag -->
  <text x="355" y="52" fill="#90e0ef" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1.5">NOVEL SASTRA</text>

  <!-- Author Name -->
  <text x="210" y="150" fill="#e0e1dd" font-family="'Plus Jakarta Sans', serif" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="3">LEILA S. CHUDORI</text>
  <line x1="130" y1="168" x2="290" y2="168" stroke="#90e0ef" stroke-width="1.5" opacity="0.6"/>

  <!-- Book Title -->
  <text x="210" y="235" fill="url(#goldText)" font-family="'Plus Jakarta Sans', serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="1">LAUT</text>
  <text x="210" y="275" fill="#ffffff" font-family="'Plus Jakarta Sans', serif" font-size="32" font-weight="900" text-anchor="middle" letter-spacing="2">BERCERITA</text>

  <!-- Sea Depth Illustration -->
  <g transform="translate(160, 320)">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#00b4d8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
    <path d="M 30,55 Q 50,30 70,55 Q 50,45 30,55 Z" fill="#90e0ef" opacity="0.8"/>
    <circle cx="38" cy="48" r="2" fill="#07192f"/>
  </g>

  <!-- Award Badge -->
  <g transform="translate(210, 450)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#07192f" stroke="#f6d365" stroke-width="1.2"/>
    <text x="0" y="4" fill="#f6d365" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">PEMENANG S.E.A. WRITE AWARD</text>
  </g>

  <!-- Footer SKU & Barcode indicator -->
  <text x="210" y="525" fill="#778da9" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">SKU: BKU-NVL-01 | GRAMEDIA</text>
</svg>
